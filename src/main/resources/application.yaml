spring:
  application:
    name: marketplace-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DB_USER:marketplace}
    password: ${DB_PASSWORD:marketplace}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
