openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: Товары, заказы и промокоды маркетплейса.
tags:
  - name: Products
    description: Товары каталога.
  - name: Orders
    description: Заказы пользователей.
  - name: Promos
    description: Промокоды.
  - name: Auth
    description: Регистрация и токены.
security:
  - bearerAuth: []
paths:
  /products:
    post:
      tags: [Products]
      operationId: createProduct
      summary: Создать товар
      description: "SELLER создаёт товар только для себя. ADMIN может указать seller_id пользователя с ролью SELLER или ADMIN; без seller_id владельцем будет текущий пользователь. USER доступ запрещён."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Товар создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: VALIDATION_ERROR. Некорректные данные товара.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/HttpError'
    get:
      tags: [Products]
      operationId: listProducts
      summary: Получить список товаров
      description: "USER, SELLER и ADMIN могут получить все товары. Без фильтра возвращаются товары всех статусов. Сортировка по времени создания и ID."
      parameters:
        - name: page
          in: query
          description: Номер страницы, начиная с нуля.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Размер страницы.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Статус товара.
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: category
          in: query
          description: Категория, точное совпадение.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Страница товаров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: VALIDATION_ERROR. Некорректные параметры списка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/HttpError'
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID товара.
        schema:
          type: string
          format: uuid
    get:
      tags: [Products]
      operationId: getProduct
      summary: Получить товар
      description: "USER, SELLER и ADMIN могут получить любой товар."
      responses:
        '200':
          description: Товар найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: "VALIDATION_ERROR. Некорректный ID товара."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PRODUCT_NOT_FOUND. Товар не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/HttpError'
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Обновить товар
      description: "SELLER может изменять только свои товары, ADMIN любые. USER доступ запрещён. Владелец товара не меняется. Полностью заменяет изменяемые поля товара. Отсутствующее описание очищается."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Товар обновлён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: VALIDATION_ERROR. Некорректные данные товара.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PRODUCT_NOT_FOUND. Товар не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/HttpError'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Архивировать товар
      description: "SELLER может архивировать только свои товары, ADMIN любые. USER доступ запрещён. Переводит товар в статус ARCHIVED и сохраняет запись в каталоге."
      responses:
        '204':
          description: Товар архивирован.
        '400':
          description: "VALIDATION_ERROR. Некорректный ID товара."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PRODUCT_NOT_FOUND. Товар не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/HttpError'
  /orders:
    post:
      tags:
      - Orders
      operationId: createOrder
      summary: Создать заказ
      description: "USER и ADMIN могут создать заказ для себя. SELLER доступ запрещён. Резервирует товары и сохраняет текущие цены. Пользователь может иметь один активный заказ."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Заказ создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: VALIDATION_ERROR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PRODUCT_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ORDER_HAS_ACTIVE, PRODUCT_INACTIVE или INSUFFICIENT_STOCK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: PROMO_CODE_INVALID или PROMO_CODE_MIN_AMOUNT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: ORDER_LIMIT_EXCEEDED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/HttpError'
  /orders/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Orders
      operationId: getOrder
      summary: Получить заказ
      description: "USER может получить только свой заказ, ADMIN любой. SELLER доступ запрещён."
      responses:
        '200':
          description: Заказ найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: VALIDATION_ERROR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "ACCESS_DENIED или ORDER_OWNERSHIP_VIOLATION."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ORDER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/HttpError'
    put:
      tags:
      - Orders
      operationId: updateOrder
      summary: Обновить заказ
      description: "USER может изменить только свой заказ, ADMIN любой. SELLER доступ запрещён. Заменяет позиции заказа в состоянии CREATED. Существующие позиции сохраняют цену, новые получают текущую цену товара. Промокод пересчитывается; при сумме ниже минимальной он снимается с возвратом использования. Истёкший или отключённый промокод вызывает PROMO_CODE_INVALID и откат операции."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Заказ обновлён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: VALIDATION_ERROR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "ACCESS_DENIED или ORDER_OWNERSHIP_VIOLATION."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ORDER_NOT_FOUND или PRODUCT_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: INVALID_STATE_TRANSITION, PRODUCT_INACTIVE или INSUFFICIENT_STOCK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: PROMO_CODE_INVALID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: ORDER_LIMIT_EXCEEDED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/HttpError'
  /orders/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Orders
      operationId: cancelOrder
      summary: Отменить заказ
      description: "USER может отменить только свой заказ, ADMIN любой. SELLER доступ запрещён. Из CREATED и PAYMENT_PENDING возвращает остатки и использование промокода, устанавливает CANCELED."
      responses:
        '200':
          description: Заказ отменён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: VALIDATION_ERROR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "ACCESS_DENIED или ORDER_OWNERSHIP_VIOLATION."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ORDER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: INVALID_STATE_TRANSITION.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/HttpError'
  /orders/{id}/status:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Orders
      operationId: changeStatus
      summary: Изменить статус заказа
      description: "Доступно только ADMIN. USER и SELLER доступ запрещён. Последовательно переводит CREATED, PAYMENT_PENDING, PAID, SHIPPED, COMPLETED. Отмена выполняется отдельным методом."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderState'
      responses:
        '200':
          description: Статус изменён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: VALIDATION_ERROR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ORDER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: INVALID_STATE_TRANSITION.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/HttpError'
  /promo-codes:
    post:
      tags:
      - Promos
      operationId: createPromo
      summary: Создать промокод
      description: "Доступно SELLER и ADMIN. USER доступ запрещён. Процентная скидка выше 70% не уменьшает сумму заказа, но расходует использование промокода."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCreate'
      responses:
        '201':
          description: Промокод создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoResponse'
        '400':
          description: VALIDATION_ERROR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/HttpError'
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: Зарегистрировать пользователя
      description: "Доступно без авторизации. Создаёт пользователя с ролью USER. Email приводится к нижнему регистру."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      responses:
        '201':
          description: Пользователь создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '400':
          description: VALIDATION_ERROR. Некорректные данные или email уже зарегистрирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/HttpError'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Получить токены
      description: "Доступно без авторизации."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Токены выданы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          description: VALIDATION_ERROR. Некорректные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: AUTH_FAILED. Неверный email или пароль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/HttpError'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refresh
      summary: Обновить токены
      description: "Доступно без access token. Выдаёт новую пару токенов и отзывает переданный refresh token."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
      responses:
        '200':
          description: Токены обновлены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          description: VALIDATION_ERROR. Некорректные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: REFRESH_TOKEN_INVALID. Недействительный, истёкший или отозванный токен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/HttpError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]
    ProductCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - price
      - stock
      - category
      - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-field-extra-annotation: '@get:jakarta.validation.constraints.Digits(integer = 10, fraction = 2)'
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
          nullable: true
          description: Владелец товара. SELLER может указать только себя, ADMIN может выбрать SELLER или ADMIN. По умолчанию текущий
            пользователь.
    ProductUpdate:
      type: object
      additionalProperties: false
      required: [name, price, stock, category, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-field-extra-annotation: "@get:jakarta.validation.constraints.Digits(integer = 10, fraction = 2)"
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
    ProductResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - price
      - stock
      - category
      - status
      - created_at
      - updated_at
      - seller_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-field-extra-annotation: '@get:jakarta.validation.constraints.Digits(integer = 10, fraction = 2)'
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        seller_id:
          type: string
          format: uuid
          description: ID владельца товара.
    ProductPage:
      type: object
      additionalProperties: false
      required: [items, totalElements, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error_code, message]
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    OrderStatus:
      type: string
      enum:
      - CREATED
      - PAYMENT_PENDING
      - PAID
      - SHIPPED
      - COMPLETED
      - CANCELED
    OrderLine:
      type: object
      additionalProperties: false
      required:
      - product_id
      - quantity
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
    OrderCreate:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: Каждый product_id встречается один раз.
          items:
            $ref: '#/components/schemas/OrderLine'
        promo_code:
          type: string
          nullable: true
          pattern: ^[A-Z0-9_]{4,20}$
    OrderUpdate:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: Каждый product_id встречается один раз.
          items:
            $ref: '#/components/schemas/OrderLine'
    OrderState:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
    OrderItem:
      type: object
      additionalProperties: false
      required:
      - id
      - product_id
      - quantity
      - price_at_order
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
        price_at_order:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
    OrderResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - status
      - total_amount
      - discount_amount
      - created_at
      - updated_at
      - items
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        promo_code_id:
          type: string
          format: uuid
          nullable: true
        total_amount:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        discount_amount:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItem'
    PromoKind:
      type: string
      enum:
      - PERCENTAGE
      - FIXED_AMOUNT
    PromoCreate:
      type: object
      additionalProperties: false
      required:
      - code
      - discount_type
      - discount_value
      - min_order_amount
      - max_uses
      - valid_from
      - valid_until
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_]{4,20}$
        discount_type:
          $ref: '#/components/schemas/PromoKind'
        discount_value:
          type: number
          format: decimal
          description: Для PERCENTAGE от 0.01 до 100, для FIXED_AMOUNT от 0.01 до 9999999999.99.
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Digits(integer = 10, fraction = 2)'
        min_order_amount:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Digits(integer = 10, fraction = 2)'
        max_uses:
          type: integer
          format: int32
          minimum: 1
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
          description: Не раньше valid_from.
        active:
          type: boolean
          default: true
    PromoResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - discount_type
      - discount_value
      - min_order_amount
      - max_uses
      - current_uses
      - valid_from
      - valid_until
      - active
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[A-Z0-9_]{4,20}$
        discount_type:
          $ref: '#/components/schemas/PromoKind'
        discount_value:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
        min_order_amount:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        max_uses:
          type: integer
          format: int32
          minimum: 1
        current_uses:
          type: integer
          format: int32
          minimum: 0
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean

    Register:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Не более 72 байт UTF-8.
    Login:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          description: Не более 72 байт UTF-8.
    Refresh:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
    Tokens:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          pattern: ^Bearer$
          example: Bearer
        expires_in:
          type: integer
          format: int32
          minimum: 1
          description: Срок действия access token в секундах.
          example: 900
    UserView:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    UserRole:
      type: string
      enum:
      - USER
      - SELLER
      - ADMIN

  responses:
    ProductMissing:
      description: PRODUCT_NOT_FOUND (404). Товар не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProductInactive:
      description: PRODUCT_INACTIVE (409). Товар недоступен для заказа.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderMissing:
      description: ORDER_NOT_FOUND (404). Заказ не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderLimit:
      description: ORDER_LIMIT_EXCEEDED (429). Слишком частая операция.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderConflict:
      description: ORDER_HAS_ACTIVE, INVALID_STATE_TRANSITION, INSUFFICIENT_STOCK (409). Нарушены условия заказа.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PromoInvalid:
      description: PROMO_CODE_INVALID, PROMO_CODE_MIN_AMOUNT (422). Промокод неприменим.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Ownership:
      description: "ACCESS_DENIED или ORDER_OWNERSHIP_VIOLATION (403). Заказ принадлежит другому пользователю."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Validation:
      description: VALIDATION_ERROR (400). Поля и нарушения перечислены в details.fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Internal:
      description: INTERNAL_ERROR (500). Внутренняя ошибка.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: "TOKEN_INVALID или TOKEN_EXPIRED (401). Bearer токен отсутствует, недействителен или истёк."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: "ACCESS_DENIED (403). Недостаточно прав для операции."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HttpError:
      description: "NOT_FOUND (404), METHOD_NOT_ALLOWED (405), UNSUPPORTED_MEDIA_TYPE (415) или INTERNAL_ERROR (500)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
